server:
  port: 8083
spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://localhost:5432/finpay_identity
    username: finpay
    password: finpay
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    tags:
      service: identity-service

finpay:
  identity:
    # OIDC (ADR-0006): issuer of external (Keycloak) tokens we trust.
    oidc-issuer: https://keycloak.finpay.local/realms/finpay
    # Internal FinPay token signing secret (injected from secret store in prod).
    internal-token-secret: ""
    internal-token-issuer: finpay-internal
    internal-token-ttl-seconds: 3600
    # KYC (FP-63): state starts in REVIEW, never auto-APPROVE.
    kyc:
      allowed-states: REVIEW,PENDING,APPROVED,REJECTED
