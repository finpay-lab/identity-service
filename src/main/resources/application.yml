server:
  port: 8080

spring:
  application:
    name: identity-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/identity}
    username: ${DB_USERNAME:identity}
    password: ${DB_PASSWORD:identity}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        request.timeout.ms: 10000
        delivery.timeout.ms: 15000

# ADR-0006: identity-service maps an IdP-validated subject to an internal
# principal and issues the FinPay-internal token. It never verifies IdP
# signatures — the gateway validates the OIDC JWT (JWKS) before forwarding.
finpay:
  identity:
    # Allowed token issuer(s). Tokens with a different `iss` are rejected.
    issuer: ${OIDC_ISSUER:finpay-keycloak}
    token:
      # HS256 secret for the FinPay-internal principal token (>= 32 bytes).
      secret: ${INTERNAL_TOKEN_SECRET:finpay-internal-token-secret-0123456789abcdef}
      ttl-minutes: ${INTERNAL_TOKEN_TTL_MINUTES:15}
  kafka:
    topic:
      identity: ${IDENTITY_TOPIC:finpay.identity}
  outbox:
    enabled: ${OUTBOX_RELAY_ENABLED:true}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:500}
    batch-size: ${OUTBOX_BATCH_SIZE:100}